name: Unit Tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: unit-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests (${{ matrix.stage }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - stage: web
            package: "@kobi/web"
          - stage: worker
            package: "@kobi/worker"
          - stage: activities
            package: "@kobi/activities"
          - stage: curriculum
            package: "@kobi/curriculum"
          - stage: repo-hygiene
            package: "@kobi/repo-hygiene"
          - stage: evals
            package: "@kobi/evals"
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm --filter "${{ matrix.package }}" test
